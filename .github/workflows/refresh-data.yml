name: Refresh Compendium Data

# Runs daily at 22:00 UTC (after US market close).
# Pulls fresh prices via yfinance and macro indicators via FRED.
# Commits updated /data/*.json files back to the repo.
#
# Setup:
#   1. Get a free FRED API key at https://fred.stlouisfed.org/docs/api/api_key.html
#   2. Add it as a repo secret named FRED_API_KEY (Settings → Secrets and variables → Actions)
#   3. Make sure repo Actions have write permission (Settings → Actions → General → Workflow permissions)
#
# Without FRED_API_KEY the macro page falls back to ETF-implied proxies (which still work).

on:
  schedule:
    - cron: '0 22 * * 1-5'   # weekdays at 22:00 UTC
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run refresh script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/refresh_data.py --throttle 0.3

      - name: Commit & push if data changed
        run: |
          git config user.name  "compendium-bot"
          git config user.email "compendium-bot@users.noreply.github.com"
          git add data/prices.json data/macro.json data/last_updated.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
