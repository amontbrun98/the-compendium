name: Refresh Compendium Data

# Runs daily at 22:00 UTC (after US market close).
# Pulls fresh prices via yfinance and macro indicators via FRED.
# Commits updated /data/*.json files back to the repo.
#
# Setup:
#   1. Get a free FRED API key at https://fred.stlouisfed.org/docs/api/api_key.html
#   2. Add it as a repo secret named FRED_API_KEY (Settings → Secrets and variables → Actions)
#   3. Make sure repo Actions have write permission (Settings → Actions → General → Workflow permissions)
#
# Without FRED_API_KEY the macro page falls back to ETF-implied proxies (which still work).

on:
  schedule:
    - cron: '0 22 * * 1-5'   # weekdays at 22:00 UTC — prices + macro
    - cron: '0 22 * * 0'     # Sundays at 22:00 UTC — also refresh historical returns
  workflow_dispatch:           # allow manual runs from the Actions tab
    inputs:
      with_returns:
        description: 'Also refresh historical returns (data/returns.json). Adds ~1 min.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # Returns get refreshed on Sundays (cron '0 22 * * 0') or when manual
          # dispatch sets with_returns=true. Otherwise just prices + macro.
          if [ "${{ github.event.schedule }}" = "0 22 * * 0" ] || [ "${{ github.event.inputs.with_returns }}" = "true" ]; then
            python scripts/refresh_data.py --with-returns --throttle 0.3
          else
            python scripts/refresh_data.py --throttle 0.3
          fi

      - name: Commit & push if data changed
        run: |
          git config user.name  "compendium-bot"
          git config user.email "compendium-bot@users.noreply.github.com"
          git add data/prices.json data/macro.json data/last_updated.json data/returns.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          # Race-safe push: try, and if remote moved, rebase on top and retry up to 3x.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push failed (attempt $attempt) — rebasing on latest main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "push failed after 3 attempts"
          exit 1
